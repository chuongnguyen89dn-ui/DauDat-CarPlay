name: Build DuoDash AiraW Engine 2.1.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build 427x240 integration layer
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1
          PKG=$(ls packages/*.deb | head -1)
          mkdir -p /tmp/layer
          dpkg-deb -x "$PKG" /tmp/layer
          find /tmp/layer -type f -maxdepth 8 -print

      - name: Rebuild DuoDash AiraW Engine package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/dd21"
          mkdir -p "$ROOT/DEBIAN"

          curl -fL "https://raw.githubusercontent.com/Haoioio/nbrepo.github.io/main/pcbang/debs/com.999.airaw_1.7.1k_iphoneos-arm64e.deb" -o "$RUNNER_TEMP/airaw.deb"
          curl -fL "https://raw.githubusercontent.com/Haoioio/nbrepo.github.io/main/pcbang/debs/com.sensetechlab.duodash_1.1.3_iphoneos-arm64e.deb" -o "$RUNNER_TEMP/duodash.deb"

          dpkg-deb -x "$RUNNER_TEMP/airaw.deb" "$ROOT"
          dpkg-deb -x "$RUNNER_TEMP/duodash.deb" "$ROOT"

          LAYER=$(find /tmp/layer -type f \( -name 'DuoDashAirawOneUI.dylib' -o -name 'DuoDashGeometryFix.dylib' \) | head -1)
          test -n "$LAYER"
          mkdir -p "$ROOT/var/jb/usr/lib/TweakInject"
          cp "$LAYER" "$ROOT/var/jb/usr/lib/TweakInject/DuoDashUnifiedFullscreen.dylib"

          python3 - <<'PY'
          import plistlib, pathlib
          p=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'dd21/var/jb/usr/lib/TweakInject/DuoDashUnifiedFullscreen.plist'
          p.parent.mkdir(parents=True,exist_ok=True)
          with p.open('wb') as f:
              plistlib.dump({'Filter':{'Bundles':['com.apple.CarPlay']}},f,fmt=plistlib.FMT_BINARY)
          PY

          rm -rf "$ROOT/var/jb/Library/dpkg/info" || true

          cat > "$ROOT/DEBIAN/control" <<'EOF'
          Package: com.chuong.duodash.airawengine
          Name: DuoDash AiraW Fullscreen Engine
          Version: 2.1.0
          Architecture: iphoneos-arm64
          Description: DuoDash 1.1.3 with AiraW CarPlay scene-host engine, Native Split bridge and known-good 427x240 geometry layer in one package.
          Maintainer: chuongnguyen89dn-ui
          Author: chuongnguyen89dn-ui
          Section: Tweaks
          Depends: mobilesubstrate
          EOF

          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          P=/var/mobile/Library/Preferences/jp.dcsyhi.airawData.plist
          PLUTIL=/usr/bin/plutil
          [ -x /var/jb/usr/bin/plutil ] && PLUTIL=/var/jb/usr/bin/plutil
          mkdir -p /var/mobile/Library/Preferences
          [ -f "$P" ] || printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict/></plist>' > "$P"
          $PLUTIL -replace kARWNativeSplitEnabledApps -json '["com.sensetechlab.duodash"]' "$P" 2>/dev/null || $PLUTIL -insert kARWNativeSplitEnabledApps -json '["com.sensetechlab.duodash"]' "$P" 2>/dev/null || true
          chown mobile:mobile "$P" 2>/dev/null || true
          killall -9 CarPlay 2>/dev/null || true
          killall -9 SpringBoard 2>/dev/null || true
          exit 0
          EOF
          printf '#!/bin/sh\nexit 0\n' > "$ROOT/DEBIAN/prerm"
          chmod 755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/prerm"

          mkdir -p out
          dpkg-deb --root-owner-group -Zxz -b "$ROOT" "out/DuoDash_1.1.3_AiraWEngine_Fullscreen427_2.1.0_iphoneos-arm64.deb"
          dpkg-deb -I "out/DuoDash_1.1.3_AiraWEngine_Fullscreen427_2.1.0_iphoneos-arm64.deb"
          shasum -a 256 out/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: DauDat-CarPlay
          path: out/*.deb
