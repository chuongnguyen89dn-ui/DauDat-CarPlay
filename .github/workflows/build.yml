name: Build DuoDash 1.1.3 Fullscreen427 + AiraW 1.6.7

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install ldid dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build Fullscreen427 layer
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1
          LAYER_DEB=$(ls packages/*.deb | head -1)
          mkdir -p "$RUNNER_TEMP/layer"
          dpkg-deb -x "$LAYER_DEB" "$RUNNER_TEMP/layer"

      - name: Fetch DuoDash 1.1.3 and AiraW 1.6.7
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://raw.githubusercontent.com/Haoioio/nbrepo.github.io/main/pcbang/debs/com.sensetechlab.duodash_1.1.3_iphoneos-arm64e.deb" -o "$RUNNER_TEMP/duodash.deb"

          curl -fL "https://axs66.github.io/repo/Packages.gz" -o "$RUNNER_TEMP/Packages.gz"
          gunzip -c "$RUNNER_TEMP/Packages.gz" > "$RUNNER_TEMP/Packages"
          AIRAW_FILE=$(awk 'BEGIN{RS="";FS="\n"} /Package: com\.Axs\.airaw/ && /Version: 1\.6\.7/ {for(i=1;i<=NF;i++) if($i ~ /^Filename: /){sub(/^Filename: /,"",$i); print $i; exit}}' "$RUNNER_TEMP/Packages")
          test -n "$AIRAW_FILE"
          case "$AIRAW_FILE" in
            http*) AIRAW_URL="$AIRAW_FILE" ;;
            *) AIRAW_URL="https://axs66.github.io/repo/${AIRAW_FILE#./}" ;;
          esac
          echo "AiraW source: $AIRAW_URL"
          curl -fL "$AIRAW_URL" -o "$RUNNER_TEMP/airaw.deb"

          echo "=== INPUT PACKAGES ==="
          dpkg-deb -f "$RUNNER_TEMP/duodash.deb" Package Version Architecture
          dpkg-deb -f "$RUNNER_TEMP/airaw.deb" Package Version Architecture
          test "$(dpkg-deb -f "$RUNNER_TEMP/airaw.deb" Version)" = "1.6.7"

      - name: Assemble one DuoDash package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/root"
          mkdir -p "$ROOT/DEBIAN"

          # DuoDash is the base runtime.
          dpkg-deb -x "$RUNNER_TEMP/duodash.deb" "$ROOT"

          # Overlay the COMPLETE AiraW 1.6.7 payload into DuoDash.
          # Nothing from the AiraW data archive is selectively removed at this stage.
          mkdir -p "$RUNNER_TEMP/airaw-root"
          dpkg-deb -x "$RUNNER_TEMP/airaw.deb" "$RUNNER_TEMP/airaw-root"
          cp -a "$RUNNER_TEMP/airaw-root/." "$ROOT/"

          # Keep the 427x240 correction layer built from this repository.
          LAYER=$(find "$RUNNER_TEMP/layer" -type f -name 'DuoDashAirawOneUI.dylib' | head -1)
          test -n "$LAYER"
          mkdir -p "$ROOT/var/jb/usr/lib/TweakInject"
          cp "$LAYER" "$ROOT/var/jb/usr/lib/TweakInject/DuoDashFullscreen427.dylib"
          cat > "$ROOT/var/jb/usr/lib/TweakInject/DuoDashFullscreen427.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>Filter</key><dict><key>Bundles</key><array><string>com.apple.CarPlay</string></array></dict></dict></plist>
          PLIST

          # dpkg control metadata is not part of dpkg-deb -x; output gets one DuoDash control.
          # Audit the complete overlaid payload before packaging.
          echo "=== POSSIBLE FILE COLLISIONS ==="
          comm -12 \
            <(cd "$RUNNER_TEMP/airaw-root" && find . -type f | sort) \
            <(dpkg-deb -c "$RUNNER_TEMP/duodash.deb" | awk '{print $NF}' | sed 's#^\./##;s#^#./#' | sort) || true

          echo "=== EMBEDDED AIRAW PAYLOAD ==="
          find "$RUNNER_TEMP/airaw-root" -type f | sort

          echo "=== DUPLICATE DYLIB / PLIST BASENAMES ==="
          find "$ROOT" -type f \( -name '*.dylib' -o -name '*.plist' \) -print | sed 's#.*/##' | sort | uniq -d || true

          cat > "$ROOT/DEBIAN/control" <<'EOF'
          Package: com.chuong.duodash.fullscreen427
          Name: DuoDash Fullscreen427
          Version: 1.1.3-427.167test2
          Architecture: iphoneos-arm64
          Description: Single DuoDash test package with 427x240 correction and embedded AiraW 1.6.7 CarPlay runtime.
          Maintainer: chuongnguyen89dn-ui
          Author: chuongnguyen89dn-ui
          Section: Tweaks
          Depends: mobilesubstrate | ellekit
          Conflicts: com.sensetechlab.duodash, com.Axs.airaw, jp.dcsyhi.airaw, com.999.airaw
          Replaces: com.sensetechlab.duodash, com.Axs.airaw, jp.dcsyhi.airaw, com.999.airaw
          EOF

          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          killall -9 CarPlay 2>/dev/null || true
          killall -9 SpringBoard 2>/dev/null || true
          exit 0
          EOF
          chmod 755 "$ROOT/DEBIAN/postinst"

          mkdir -p out
          OUT="out/DuoDash_1.1.3_Fullscreen427_AiraW167_test2_iphoneos-arm64.deb"
          dpkg-deb --root-owner-group -Zxz -b "$ROOT" "$OUT"
          echo "=== OUTPUT ==="
          dpkg-deb -I "$OUT"
          dpkg-deb -c "$OUT" | grep -E 'DuoDash|Airaw|AiraW|TweakInject' || true
          shasum -a 256 "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DuoDash-Fullscreen427-AiraW167-test2
          path: out/*.deb
