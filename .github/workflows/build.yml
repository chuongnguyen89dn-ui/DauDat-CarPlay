name: Build DauDat CarPlay

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Install ldid and iOS private frameworks
        run: |
          brew install ldid
          git clone --depth=1 https://github.com/theos/headers.git /tmp/theos-headers || true
          mkdir -p "$HOME/theos/lib"
          curl -fL https://github.com/theos/lib/releases/latest/download/lib.tar.gz -o /tmp/theos-lib.tar.gz || true
          if [ -s /tmp/theos-lib.tar.gz ]; then tar -xzf /tmp/theos-lib.tar.gz -C "$HOME/theos/lib" || true; fi
          find "$HOME/theos" -iname 'Preferences.framework' -o -iname 'libPreferences*' | head -20
      - name: Build rootless package
        run: |
          export THEOS=$HOME/theos
          make clean package FINALPACKAGE=1
          ls -lah packages
      - uses: actions/upload-artifact@v4
        with:
          name: DauDat-CarPlay
          path: packages/*.deb
